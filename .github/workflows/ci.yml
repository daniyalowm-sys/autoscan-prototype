name: Prototype checks

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest -v

      - name: Reproduce demonstration output
        run: |
          python create_synthetic_example.py --output ci_artifacts/sample.png
          python autoscan.py --input ci_artifacts/sample.png --output ci_artifacts/results --save-debug

      - name: Upload demonstration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoscan-${{ matrix.python-version }}
          path: ci_artifacts/

